<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeff 提词器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="viewport">
    <div id="dropzone">
      <div class="drop-icon">⬇</div>
      <div class="drop-title">把文案拖到这里</div>
      <div class="drop-sub">支持 .txt 和 Word(.docx) 文件</div>
      <button id="btn-open" class="btn">打开文件</button>
    </div>
    <div id="track"></div>
  </div>

  <div id="speed-control">
    <button id="btn-plus" class="spd" title="加快">＋</button>
    <div id="speed-val">250</div>
    <div class="spd-unit">字/分</div>
    <button id="btn-minus" class="spd" title="放慢">－</button>
  </div>

  <div id="topbar">
    <button id="btn-full" class="btn small">全屏</button>
  </div>

  <div id="hint">空格 开始/暂停　↑ 上一句　↓ 下一句</div>

  <script src="app.js"></script>
</body>
</html>
